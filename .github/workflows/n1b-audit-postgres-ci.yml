name: N1-B Isolated PostgreSQL Audit Log Guard LAB
on:
  push:
    branches: ['test/n1b-google-provider-https-20261101']
  pull_request:
    branches: ['feat/n1b-google-admission-lab-20261101']
permissions:
  contents: read
jobs:
  audit-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: n1b_lab
          POSTGRES_USER: n1b_lab
          POSTGRES_PASSWORD: n1b_disposable_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U n1b_lab -d n1b_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://n1b_lab:n1b_disposable_ci_only@127.0.0.1:5432/n1b_lab?schema=public
      N1B_ALLOW_EPHEMERAL_DB_TEST: 'yes'
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: synthetic-only-audit-signing-secret-dont-use-in-production-2026
      GOOGLE_CLIENT_ID: synthetic-google-id.apps.invalid
      GOOGLE_CLIENT_SECRET: synthetic-google-secret
      NEXOSAI_BOOTSTRAP_ADMIN_EMAIL: bootstrap@lab.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prisma generate
      - name: Disposable PostgreSQL only
        run: npx prisma db push --skip-generate
      - name: Tenant-only audit query with real Prisma
        run: node --test test/n1b-audit-postgres.test.mjs test/n1b-audit-tenant-access.test.mjs
      - name: Production Next.js build for secure audit page
        run: npm run build
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high
