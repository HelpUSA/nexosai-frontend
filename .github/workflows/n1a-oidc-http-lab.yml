name: NexosAI N1-A Synthetic OIDC HTTP Integration LAB
on:
  push:
    branches: ['test/n1a-oidc-http-integration-20261101']
  pull_request:
    branches: ['test/n1a-auth-runtime-risk-lab-20261031']
permissions:
  contents: read
jobs:
  oidc-localhost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        node: ['22','24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependency lock exactly
        run: npm ci --ignore-scripts --no-fund
      - name: Existing N1-A fail-closed and static inventory suites
        run: node --test test/n1a-auth-env.test.mjs test/n1a-security-inventory.test.mjs
      - name: Real NextAuth HTTP flow against isolated loopback OIDC issuer
        run: node --test test/n1a-oidc-http-integration.test.mjs
      - name: Audit all production dependencies, all severities
        run: npm audit --omit=dev --audit-level=low
      - name: Enforce no high/critical dependency findings
        run: npm audit --audit-level=high
