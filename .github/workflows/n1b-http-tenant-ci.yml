name: NexosAI N1-B HTTP Tenant Membership Guard LAB
on:
  push:
    branches: ['test/n1b-http-tenant-enforcement-20261101']
  pull_request:
    branches: ['test/n1a-oidc-http-integration-20261101']
permissions:
  contents: read
jobs:
  http-tenant-guards:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        node: ['22','24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Deterministic clean installation
        run: npm ci --ignore-scripts --no-fund
      - name: HTTP authorization and NextAuth JWT integration lab
        env:
          N1B_LAB_DEBUG: '1'
        run: node --test test/n1b-http-tenant-guards.test.mjs
      - name: OIDC handler integration regression
        run: node --test test/n1a-oidc-http-integration.test.mjs
      - name: Existing auth config and inventory regressions
        run: node --test test/n1a-auth-env.test.mjs test/n1a-security-inventory.test.mjs
      - name: Reject all known advisories for production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Reject all critical/high advisories
        run: npm audit --audit-level=high
