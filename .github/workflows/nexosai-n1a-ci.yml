name: NexosAI N1-A Draft Auth Security
on:
  push:
    branches: ['feat/n1a-*']
  pull_request:
    branches: ['main']
jobs:
  sandbox-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: synthetic-ci-only-signing-value-not-valid-for-deployment-2026
      GOOGLE_CLIENT_ID: synthetic-oauth-id.apps.invalid
      GOOGLE_CLIENT_SECRET: synthetic-oauth-client-secret
      NEXOSAI_BOOTSTRAP_ADMIN_EMAIL: bootstrap@example.invalid
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing upstream package-lock is inconsistent; regenerate only inside disposable CI runner.
      # Release gate remains BLOCKED until updated lockfile is separately reviewed/committed.
      - run: npm install --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: node --test test/n1a-auth-env.test.mjs
      - run: npx prisma generate
      - run: npm run build
