name: G3C Agents Tenant Page Guard (Sandbox)
on:
  push:
    branches:
      - fix/g3c-agent-page-tenant-leak-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-tenant-page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: synthetic-ci-only-signing-value-not-valid-for-deployment-2026
      GOOGLE_CLIENT_ID: synthetic-oauth-id.apps.invalid
      GOOGLE_CLIENT_SECRET: synthetic-oauth-client-secret
      NEXOSAI_BOOTSTRAP_ADMIN_EMAIL: bootstrap@example.invalid
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/no_network_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Agent page authorization and data minimization unit tests
        run: node --test test/n1b-agent-page-tenant-guard.test.mjs test/n1b-admin-guard.test.mjs test/n1b-order040-independent-acceptance.test.mjs
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Next.js production build
        run: npm run build
      - name: Production dependencies security gate
        run: npm audit --omit=dev --audit-level=low
