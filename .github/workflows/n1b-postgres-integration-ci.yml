name: NexosAI G3C PostgreSQL Membership Integration LAB
on:
  push:
    branches: ['test/g3c-postgres-integration-20261101']
  pull_request:
    branches: ['audit/n1b-dev-advisories-20261101']
permissions:
  contents: read
jobs:
  postgres-tenant-authz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexosai_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nexosai_g3c_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexosai_test -d nexosai_g3c_test"
          --health-interval 3s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://nexosai_test:local_ci_only@127.0.0.1:5432/nexosai_g3c_test
      G3C_EPHEMERAL_POSTGRES: 'YES'
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: synthetic-ci-only-signing-value-not-valid-for-deployment-2026
      GOOGLE_CLIENT_ID: synthetic-oauth-id.apps.invalid
      GOOGLE_CLIENT_SECRET: synthetic-oauth-client-secret
      NEXOSAI_BOOTSTRAP_ADMIN_EMAIL: bootstrap@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Ephemeral schema application (never a production migration)
        run: npx prisma db push --skip-generate
      - name: Postgres authorization integration
        run: node --test test/n1b-postgres-membership.integration.test.mjs
      - name: Existing unit and OIDC HTTP regression
        run: node --test test/n1b-scoped-resources.test.mjs test/n1b-provisioning-policy.test.mjs test/n1b-prisma-session-guard.test.mjs test/n1b-http-tenant-guards.test.mjs test/n1a-oidc-http-integration.test.mjs
      - run: npm run build
      - name: Actual Next.js unauthenticated route smoke (no real identity)
        run: node test/n1b-next-http-unauth.smoke.mjs
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high
