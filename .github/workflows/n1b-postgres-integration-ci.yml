name: NexosAI G3C PostgreSQL Membership Integration LAB
on:
  push:
    branches:
      - 'test/g3c-postgres-integration-20261101'
      - 'test/g3c-order038-gaps-closure-20261101'
      - 'test/g3c-unified-gates-candidate-20261102'
  pull_request:
    branches:
      - 'audit/n1b-dev-advisories-20261101'
      - 'test/g3c-postgres-integration-20261101'
      - 'main'
permissions:
  contents: read
jobs:
  postgres-tenant-authz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexosai_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nexosai_g3c_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexosai_test -d nexosai_g3c_test"
          --health-interval 3s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://nexosai_test:local_ci_only@127.0.0.1:5432/nexosai_g3c_test
      G3C_EPHEMERAL_POSTGRES: 'YES'
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: synthetic-ci-only-signing-value-not-valid-for-deployment-2026
      GOOGLE_CLIENT_ID: synthetic-oauth-id.apps.invalid
      GOOGLE_CLIENT_SECRET: synthetic-oauth-client-secret
      NEXOSAI_BOOTSTRAP_ADMIN_EMAIL: bootstrap@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Run versioned Prisma migrate deploy on disposable database
        run: npx prisma migrate deploy
      - name: Verify versioned Prisma migration history on disposable database (fail-hard)
        run: npx prisma migrate status
      - name: Verify idempotent migration re-deployment
        run: npx prisma migrate deploy
      - name: Baseline ephemeral push
        run: npx prisma db push --skip-generate
      - name: Admin & tenant authorization unit regression
        run: node --test test/n1b-admin-guard.test.mjs test/n1b-scoped-resources.test.mjs test/n1b-provisioning-policy.test.mjs test/n1b-prisma-session-guard.test.mjs test/n1b-http-tenant-guards.test.mjs test/n1a-oidc-http-integration.test.mjs test/n1b-order040-independent-acceptance.test.mjs
      - name: Postgres authorization integration
        run: node --test test/n1b-postgres-membership.integration.test.mjs
      - run: npm run build
      - name: Actual Next.js unauthenticated route smoke (no real identity)
        run: node test/n1b-next-http-unauth.smoke.mjs
      - name: NextAuth runtime must fail closed when all login secrets are missing
        run: node test/n1a-next-http-missing-secrets.smoke.mjs
      - name: Authenticated HTTP session enforcement, edge redirect and PostgreSQL RBAC
        run: node test/n1b-next-http-auth.integration.test.mjs
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=high
