name: G3C Demo Data Honesty (Sandbox)
on:
  push:
    branches:
      - test/g3c-unified-hardening-candidate-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-status:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_SECRET: synthetic-ci-only-signing-value-not-valid-for-deployment-2026
      GOOGLE_CLIENT_ID: synthetic-oauth-id.apps.invalid
      GOOGLE_CLIENT_SECRET: synthetic-oauth-client-secret
      NEXOSAI_BOOTSTRAP_ADMIN_EMAIL: bootstrap@example.invalid
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/never_connect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: node --test test/n2a-demo-status-honesty.test.mjs
      - run: npx prisma generate
      - run: npm run build
